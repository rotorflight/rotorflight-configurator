<!--
  File: src/images/remap_fc/FLYDRAGON_BRAND.svg
  The "FLYDRAGON" wordmark (lifted out of flydragon.svg, the "pro"
  suffix dropped) stacked above the Rotorflight rotor-blur mark (see
  rotorflight.svg) — a single composed image rather than two
  separate overlays, since the live diagram now loads one
  <MANUFACTURER>_BRAND.svg per manufacturer as one <image>. The
  taller canvas (vs. just the wordmark alone) is deliberate: it
  fills the gap between the logo and the board's model number below
  it once scaled to the diagram's fixed brand-image width. Kept
  separate so it can be overlaid on the generic board diagram only
  for manufacturer "FDRC", rather than baked into a fixed board
  shape.
-->
