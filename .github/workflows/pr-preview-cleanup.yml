name: PR Preview Cleanup

# Removes a PR's /pr/<number>/ preview from the gh-pages branch when the PR is
# closed or loses its "preview" label. Publish GitHub Pages then puts the
# change live.
#
# pull_request_target runs the base branch's copy of this file with a write
# token; it only deletes a directory and never checks out the PR's code.

on:
  pull_request_target:
    types:
      - closed
      - unlabeled
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    name: Remove PR Preview
    if: github.event.action == 'closed' || github.event.label.name == 'preview'
    runs-on: ubuntu-latest

    # Shared with PR Preview Publish; see there.
    concurrency:
      group: pages-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout GitHub Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: pages

      - name: Remove preview from GitHub Pages branch
        id: remove
        shell: bash
        run: |
          DEPLOY_PATH="pr/$PR_NUMBER"

          cd pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Same retry-on-rejected-push loop as deploy-web.yml.
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git reset --hard origin/gh-pages

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "No preview found for pages/$DEPLOY_PATH"
              exit 0
            fi
            rm -rf "$DEPLOY_PATH" "$DEPLOY_PATH.json"

            cp -R ../.github/pages/. .
            touch .nojekyll
            python3 ../.github/scripts/generate_versions.py

            git add .
            git commit -m "cleanup: remove preview for PR #$PR_NUMBER"

            if git push origin gh-pages; then
              echo "removed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "gh-pages push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done

          echo "Failed to publish to gh-pages after 5 attempts"
          exit 1

      - name: Update the PR's preview comment
        if: steps.remove.outputs.removed == 'true'
        shell: bash
        run: |
          MARKER="<!-- pr-preview -->"
          COMMENT_ID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | head -n 1)"
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
              -f body="$MARKER
          **Web preview:** removed. Add the \`preview\` label to deploy it again." >/dev/null
          fi
