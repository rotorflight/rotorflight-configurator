name: Publish GitHub Pages

# Deploys the gh-pages branch to GitHub Pages (Settings -> Pages -> Source:
# "GitHub Actions"). The workflows that change gh-pages -- Deploy Web App,
# PR Preview Publish, PR Preview Cleanup and PR Branch Info -- only push to
# the branch; this one runs after each of them and publishes whatever the
# branch holds.
#
# The classic "deploy from a branch" source rebuilt the site on every push to
# gh-pages, and when pushes arrived seconds apart the earlier builds failed.
# If the last push of a burst was one of them the site stayed stale. Here
# every run deploys the branch as it is when the run starts, so the last run
# in always publishes the newest tree.

on:
  workflow_run:
    workflows:
      - Deploy Web App
      - PR Preview Publish
      - PR Preview Cleanup
      - PR Branch Info
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One site, one queue. GitHub keeps a single pending run per group and a newer
# one replaces it, which is what we want: the replacement deploys the same
# (or a newer) gh-pages tree. An in-progress deploy is left to finish.
concurrency:
  group: pages-publish
  cancel-in-progress: false

# Upload and deploy are separate jobs. deploy-pages looks the artifact up once,
# and a just-finalized artifact can take seconds to show up in that listing
# (actions/deploy-pages#451): run straight after the upload in the same job,
# the lookup found nothing and the deploy failed. Starting a second job gives
# the artifact that time, and the deploy retries once after a wait in case it
# still isn't there. (Re-running a failed run doesn't help: it uploads a
# second artifact and deploy-pages refuses to choose between the two.)
jobs:
  upload:
    name: Upload gh-pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  publish:
    name: Deploy gh-pages to GitHub Pages
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait for the artifact to be listed
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
